name: Core CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node.js 24
      - name: Verify repository policy and design manifest
        run: python tools/ci_verify.py
      - name: Configure
        run: cmake -S cpp -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: python tools/ci_build.py ${{ matrix.configuration }}
      - name: Test
        run: python tools/ci_test.py ${{ matrix.configuration }}
      - name: Release performance fixtures (Linux)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_scheduler_benchmark
          ./build/ci/antworld_s1_benchmark
          ./build/ci/antworld_benchmark
          ./build/ci/antworld_s2_benchmark
          ./build/ci/antworld_s3_benchmark
          ./build/ci/antworld_s4_benchmark build/ci/s4-performance.csv
          ./build/ci/antworld_s5_benchmark build/ci/s5-performance 1000 interleaved 2
          ./build/ci/antworld_s5_history_benchmark build/ci/s5-history 30 100
          ./build/ci/antworld_s6_contact_benchmark build/ci/s6-contact-smoke 1 128
      - name: Reproduce all S4 seeds (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s4_experiment build/ci/s4-experiments 32
          python tools/verify_s4_reproduction.py build/ci/s4-experiments --source-commit "$GITHUB_SHA" --checkpoint-byte-delta 9 --physics-version 9 --report build/ci/s4-reproduction.json
      - name: Reproduce all S5 seeds (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s5_experiment build/ci/s5-experiments 32
          python tools/verify_s5_reproduction.py build/ci/s5-experiments --source-commit "$GITHUB_SHA" --checkpoint-byte-delta 1 --report build/ci/s5-reproduction.json
      - name: Reproduce first complete S6 seed (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_experiment build/ci/s6-reproduction 1 primary
          python tools/verify_s6_reproduction.py build/ci/s6-reproduction --source-commit "$GITHUB_SHA" --cross-platform --schema-version 8 --physics-version 9 --checkpoint-byte-delta 2 --report build/ci/s6-reproduction.json
      - name: Audit first complete S6.1 observer seed (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_1_experiment build/ci/s6_1-observer 1 matrix 1
          python tools/analyze_s6_1.py --pilot build/ci/s6_1-observer
      - name: Reproduce S6.2 ordered scarcity and equal-demand observers (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_2_nutrition build/ci/s6_2-nutrition 1 1
          python tools/analyze_s6_2_nutrition.py --pilot build/ci/s6_2-nutrition
          ./build/ci/antworld_s6_2_choice build/ci/s6_2-choice 64
      - name: Reproduce S6.3 funded 90-day ecology and compact geometry (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_3_experiment build/ci/s6_3-review review
          python tools/verify_s6_3_reproduction.py build/ci/s6_3-review --cross-platform --report build/ci/s6_3-review.json
      - name: Reproduce S6.3.1 180-day queen controls (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_3_1_experiment build/ci/s6_3_1-review review reserve
          python tools/diagnose_s6_3_1.py build/ci/s6_3_1-review
          python tools/verify_s6_3_1_reproduction.py build/ci/s6_3_1-review --cross-platform --report build/ci/s6_3_1-review.json
      - name: Reproduce all S6.3.2 unchanged-model diagnostics (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_3_2_audit build/ci/s6_3_2-audit 6
          python tools/analyze_s6_3_2_biology.py --probes build/ci/s6_3_2-audit --verify-only
      - name: Reproduce complete S6.3.3 observation seed (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_3_3_experiment build/ci/s6_3_3-reproduction 0 primary
          python tools/verify_s6_3_3_reproduction.py build/ci/s6_3_3-reproduction
      - name: Reproduce all S6.3.3.1 exploratory retrieval seeds (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_3_3_experiment build/ci/s6_3_3_1-reproduction all retrieval-line local
          python tools/verify_s6_3_3_reproduction.py build/ci/s6_3_3_1-reproduction --retrieval-profile local
      - name: Replay timed care and normal autonomy fixtures (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_3_3_experiment build/ci/s6_3_3_2-b02 0 fidelity-b02 fidelity
          ./build/ci/antworld_s6_3_3_experiment build/ci/s6_3_3_2-autonomy 0 fidelity-integration fidelity
      - name: Run the complete first B02 uncertainty seed (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: ./build/ci/antworld_s6_3_3_experiment build/ci/s6_3_3_3-b02 0 fidelity-closure-b02 fidelity
      - name: Verify v2 history independently (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_3_4_experiment build/ci/s6_3_4-history facts-10000 7
          python tools/verify_s6_3_4_archive.py build/ci/s6_3_4-history/world.sqlite build/ci/s6_3_4-history-verification.json
      - name: Decode and reconcile the RM-02 sidecar independently (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_4_rm02 build/ci/rm02-depot ecology depot 32 1
          python tools/verify_s6_4_rm02_sidecar.py build/ci/rm02-depot
      - name: Reconcile the archived RM-02 performance gates (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          python tools/test_s6_4_rm02_performance_reconciliation.py
          python tools/reconcile_s6_4_rm02_performance.py --check
      - name: Verify the frozen RM-02 R1 baseline (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: python tools/verify_s6_4_rm02_r1_baseline.py
      - name: Verify WP-2 provenance, native timing and representative archives (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          python tools/build_s6_4_wp2_evidence.py --check
          python tools/test_s6_4_wp2_observations.py
          python tools/analyze_s6_4_wp2_performance.py experiments/s6_4_wp2/performance/formal experiments/s6_4_wp2/performance/formal_analysis.json --check
          python tools/analyze_s6_4_wp2.py experiments/s6_4_wp2/baseline build/ci/wp2-audit --supplement experiments/s6_4_wp2/activity_hourly --supplement experiments/s6_4_wp2/integrated_hourly --case activity-empty-32-1-empty-0-empty --case integrated-care-4-7-underground-4-balanced --case b01-removed-5-7-plain-5-own --case b02-trio-3-7-line-6-own
          python tools/summarize_s6_4_wp2.py experiments/s6_4_wp2/analysis experiments/s6_4_wp2/comparison --check

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node.js 24
      - name: Configure Clang ASan and UBSan
        run: cmake -S cpp -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DANTWORLD_SANITIZERS=ON
      - name: Build
        run: cmake --build build/sanitized --parallel 4
      - name: Test
        run: ctest --test-dir build/sanitized --output-on-failure
