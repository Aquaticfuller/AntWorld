name: Core CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node.js 24
      - name: Verify repository policy and design manifest
        run: python tools/ci_verify.py
      - name: Configure
        run: cmake -S cpp -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: python tools/ci_build.py ${{ matrix.configuration }}
      - name: Test
        run: python tools/ci_test.py ${{ matrix.configuration }}
      - name: Release performance fixtures (Linux)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_scheduler_benchmark
          ./build/ci/antworld_s1_benchmark
          ./build/ci/antworld_benchmark
          ./build/ci/antworld_s2_benchmark
          ./build/ci/antworld_s3_benchmark
          ./build/ci/antworld_s4_benchmark build/ci/s4-performance.csv
          ./build/ci/antworld_s5_benchmark build/ci/s5-performance 1000 interleaved 2
          ./build/ci/antworld_s5_history_benchmark build/ci/s5-history 30 100
          ./build/ci/antworld_s6_contact_benchmark build/ci/s6-contact-smoke 1 128
      - name: Reproduce all S4 seeds (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s4_experiment build/ci/s4-experiments 32
          python tools/verify_s4_reproduction.py build/ci/s4-experiments --source-commit "$GITHUB_SHA" --checkpoint-byte-delta 9 --physics-version 9 --report build/ci/s4-reproduction.json
      - name: Reproduce all S5 seeds (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s5_experiment build/ci/s5-experiments 32
          python tools/verify_s5_reproduction.py build/ci/s5-experiments --source-commit "$GITHUB_SHA" --checkpoint-byte-delta 1 --report build/ci/s5-reproduction.json
      - name: Reproduce first complete S6 seed (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_experiment build/ci/s6-reproduction 1 primary
          python tools/verify_s6_reproduction.py build/ci/s6-reproduction --source-commit "$GITHUB_SHA" --cross-platform --schema-version 8 --physics-version 9 --checkpoint-byte-delta 2 --report build/ci/s6-reproduction.json
      - name: Audit first complete S6.1 observer seed (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_1_experiment build/ci/s6_1-observer 1 matrix 1
          python tools/analyze_s6_1.py --pilot build/ci/s6_1-observer
      - name: Reproduce S6.2 ordered scarcity and equal-demand observers (Linux Release)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_s6_2_nutrition build/ci/s6_2-nutrition 1 1
          python tools/analyze_s6_2_nutrition.py --pilot build/ci/s6_2-nutrition
          ./build/ci/antworld_s6_2_choice build/ci/s6_2-choice 64

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0, Node.js 24
      - name: Configure Clang ASan and UBSan
        run: cmake -S cpp -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DANTWORLD_SANITIZERS=ON
      - name: Build
        run: cmake --build build/sanitized --parallel 4
      - name: Test
        run: ctest --test-dir build/sanitized --output-on-failure
