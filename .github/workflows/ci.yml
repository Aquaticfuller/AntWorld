name: Core CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify repository policy and design manifest
        run: |
          python tools/verify_handoff.py
          python tools/check_repository.py
      - name: Configure
        run: cmake -S cpp -B build/ci -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
      - name: Build
        run: cmake --build build/ci --config ${{ matrix.configuration }} --parallel 4
      - name: Test
        run: ctest --test-dir build/ci -C ${{ matrix.configuration }} --output-on-failure
      - name: Release performance fixtures (Linux)
        if: runner.os == 'Linux' && matrix.configuration == 'Release'
        run: |
          ./build/ci/antworld_scheduler_benchmark
          ./build/ci/antworld_s1_benchmark
          ./build/ci/antworld_benchmark

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure Clang ASan and UBSan
        run: cmake -S cpp -B build/sanitized -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++ -DANTWORLD_SANITIZERS=ON
      - name: Build
        run: cmake --build build/sanitized --parallel 4
      - name: Test
        run: ctest --test-dir build/sanitized --output-on-failure
