name: M1 Observatory
on:
  push:
    paths: ["cpp/**", "op0/**", "tools/*m1*.py", "tools/*first_meal*.py", "tools/verify_sustained_contact.py", "tools/verify_local_solicitation.py", "tools/verify_supply_continuity.py", "tools/audit_founding_activity.py", "tools/audit_founding_events.py", "tools/verify_oral_approach.py", "tools/verify_wick_clearance.py", "tools/verify_berth_yield.py", "tools/verify_founder_sugar.py", "tools/verify_remembered_refill.py", "tools/verify_blocked_feeder_return.py", "tools/verify_demand_refill.py", "research/single_nest/LOCAL_SOLICITATION*.gz", "research/single_nest/SUSTAINED_SUPPLY*.gz", "research/single_nest/SEED*CUT.awstate.gz", "tools/qualify_founder_access.py", "experiments/m1/**", "research/m1/**", "research/single_nest/FIRST_MEAL*.json*", "research/single_nest/evidence/founder-access/**", ".github/workflows/m1.yml"]
  pull_request:
    paths: ["cpp/**", "op0/**", "tools/*m1*.py", "tools/*first_meal*.py", "tools/verify_sustained_contact.py", "tools/verify_local_solicitation.py", "tools/verify_supply_continuity.py", "tools/audit_founding_activity.py", "tools/audit_founding_events.py", "tools/verify_oral_approach.py", "tools/verify_wick_clearance.py", "tools/verify_berth_yield.py", "tools/verify_founder_sugar.py", "tools/verify_remembered_refill.py", "tools/verify_blocked_feeder_return.py", "tools/verify_demand_refill.py", "research/single_nest/LOCAL_SOLICITATION*.gz", "research/single_nest/SUSTAINED_SUPPLY*.gz", "research/single_nest/SEED*CUT.awstate.gz", "tools/qualify_founder_access.py", "experiments/m1/**", "research/m1/**", "research/single_nest/FIRST_MEAL*.json*", "research/single_nest/evidence/founder-access/**", ".github/workflows/m1.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Compare the published founder access and transfer evidence
        shell: pwsh
        run: |
          $dir = 'research/single_nest/evidence/founder-access'
          foreach ($version in 40, 41, 42, 43, 44) {
            python -B -m tools.qualify_founder_access --compare "$dir/physics$version-windows.jsonl" "$dir/physics$version-linux.jsonl"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build the native Core observer application
        run: |
          cmake -S cpp -B build/m1 -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build/m1 --config Release --target antworld_m0_live --parallel 2
      - name: Check bounded geometry and native SQLite continuation
        shell: pwsh
        run: |
          $exe = @('build/m1/Release/antworld_m0_live.exe', 'build/m1/antworld_m0_live') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $exe) { throw 'Native live executable was not built' }
          $env:M0_LIVE_CORE = (Resolve-Path -LiteralPath $exe).Path
          $env:M0_LIVE_TEST_ROOT = $env:RUNNER_TEMP
          python -B -m tools.verify_local_solicitation --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_local_solicitation --core $exe --earlier-cut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_local_solicitation --core $exe --trip-cycle
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_local_solicitation --core $exe --exit-storage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_local_solicitation --core $exe --final-refill
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_local_solicitation --core $exe --water-cut
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_supply_continuity --core $exe --version 78 --verify-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_supply_continuity --core $exe --energy-seed 3 --verify-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_supply_continuity --core $exe --archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_supply_continuity --core $exe --panel research/single_nest/SUSTAINED_SUPPLY_TRIALS.jsonl.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-timing
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-stimulus 3 --stimulus-version 84
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-final-leg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 86
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_events --core $exe --verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 90
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_oral_approach --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 93
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_wick_clearance --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 95
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_wick_clearance --core $exe --physics 96
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_berth_yield --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 96
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_founder_sugar --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 98
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_remembered_refill --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 99
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_blocked_feeder_return --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_demand_refill --core $exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.audit_founding_activity --core $exe --verify-archive --stimulus-version 101
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_local_solicitation --core $exe --panel research/single_nest/LOCAL_SOLICITATION_TRIALS.jsonl.gz --exit-trials research/single_nest/LOCAL_SOLICITATION_EXIT_TRIALS.jsonl.gz
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_first_meal research/single_nest/FIRST_MEAL_TRIALS.jsonl --core $exe --inputs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($version in 43, 44) {
            $receipt = Join-Path $env:RUNNER_TEMP "founder-$version.jsonl"
            python -B -m tools.qualify_founder_access --core $exe --physics $version --scratch $env:RUNNER_TEMP --output $receipt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            python -B -m tools.qualify_founder_access --compare "research/single_nest/evidence/founder-access/physics$version-windows.jsonl" $receipt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -B -m unittest op0.tests.test_nest_volume `
            op0.tests.test_live.LiveTests.test_protected_default_and_paid_brood_continue_after_reload `
            op0.tests.test_live.LiveTests.test_local_roof_bites_preserve_material_and_resume `
            op0.tests.test_live.LiveTests.test_callow_water_and_nursery_wick_keep_distinct_world_inputs `
            op0.tests.test_live.LiveTests.test_local_worker_meal_search_restores_its_next_decisions `
            op0.tests.test_live.LiveTests.test_observatory_presets_preserve_native_geometry_and_resources `
            op0.tests.test_live.LiveTests.test_reachable_berth_version_and_readonly_history_survive_restore `
            op0.tests.test_live.LiveTests.test_single_nest_lays_and_transports_brood_before_workers_open_it `
            op0.tests.test_live.LiveTests.test_default_viewer_snapshot_keeps_only_a_tail_and_resumes_with_identical_facts `
            op0.tests.test_live.LiveTests.test_anatomical_nest_commits_birth_carry_and_exact_continuation `
            op0.tests.test_live.LiveTests.test_anatomical_nest_excavates_delivers_and_restores_late `
            op0.tests.test_live.LiveTests.test_founder_death_shown_in_the_view_matches_its_terminal_budget `
            op0.tests.test_live.LiveTests.test_portable_mouth_approach_keeps_the_first_step_and_canonical_history `
            op0.tests.test_live.LiveTests.test_oral_depot_meal_uptake_and_both_save_modes `
            op0.tests.test_live.LiveTests.test_worker_feeds_queen_with_paid_cargo_and_restores_the_next_uptake `
            op0.tests.test_live.LiveTests.test_loaded_worker_unloads_at_its_wall_mouth_and_restores_the_handling_transaction `
            op0.tests.test_live.LiveTests.test_familiar_return_replays_the_first_reassessment_without_warping_the_worker `
            op0.tests.test_live.LiveTests.test_local_orientation_supplies_founder_inside_chamber `
            op0.tests.test_live.LiveTests.test_carriers_clear_occupied_entrance `
            op0.tests.test_live.LiveTests.test_paid_oral_contact_from_identical_six_hour_cut `
            op0.tests.test_live.LiveTests.test_first_meal_versions_and_read_only_access `
            op0.tests.test_live.LiveTests.test_founder_and_worker_both_approach_the_verified_meal_and_resume -v
      - name: Replay physics 36 and verify canonical archives
        shell: pwsh
        run: |
          $exe = @('build/m1/Release/antworld_m0_live.exe', 'build/m1/antworld_m0_live') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          $evidence = Join-Path $env:RUNNER_TEMP 'm1-platform'
          $baseline = Join-Path $env:RUNNER_TEMP 'm1-reviewed-native'
          New-Item -ItemType Directory -Path $evidence, $baseline | Out-Null
          $reviewed = '36bbf99bd0cd28c992a6fa830dccfb9ff9e419a8'
          git fetch --no-tags --depth=1 origin $reviewed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git archive -o "$baseline/core.zip" $reviewed cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath "$baseline/core.zip" -DestinationPath "$baseline/source"
          cmake -S "$baseline/source/cpp" -B "$baseline/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build "$baseline/build" --config Release --target antworld_m0_live --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $old = @("$baseline/build/Release/antworld_m0_live.exe", "$baseline/build/antworld_m0_live") |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          python -B -m tools.run_m1_habitat archive36 --core $old > "$evidence/reviewed.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.run_m1_habitat archive36 --core $exe > "$evidence/m1.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_m1_habitat --platform-report "$evidence/m1.jsonl" > "$evidence/windows-comparison.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content -LiteralPath "$evidence/windows-comparison.json"
          python -B -m tools.verify_m1_habitat --reference "$evidence/reviewed.jsonl" --rerun "$evidence/m1.jsonl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.verify_m1_habitat --scratch $env:RUNNER_TEMP
      - name: Keep the same-platform receipts and Windows comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m1-native-${{ matrix.os }}
          path: ${{ runner.temp }}/m1-platform/
          if-no-files-found: ignore
      - name: Operate the live 3D view and archived controls in Chrome
        shell: pwsh
        run: |
          $exe = @('build/m1/Release/antworld_m0_live.exe', 'build/m1/antworld_m0_live') |
            Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          $chrome = if ($IsWindows) { 'C:/Program Files/Google/Chrome/Application/chrome.exe' } else { (Get-Command google-chrome).Source }
          $output = Join-Path $env:RUNNER_TEMP 'm1-browser-evidence'
          python -B -m tools.test_m1_browser --core $exe --browser $chrome --scratch $env:RUNNER_TEMP --output $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.test_m1_browser --core $exe --browser $chrome --scratch $env:RUNNER_TEMP --output $output --mode m1-witnesses
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.test_m1_browser --core $exe --browser $chrome --scratch $env:RUNNER_TEMP --output $output --mode m2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.test_m1_browser --core $exe --browser $chrome --scratch $env:RUNNER_TEMP --output $output --mode overhaul
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m tools.test_m1_browser --core $exe --browser $chrome --scratch $env:RUNNER_TEMP --output $output --mode founder-access
