name: OP0 Observation Preview
on:
  push:
    paths: ["op0/**", "tools/start_op0.ps1", ".github/workflows/op0.yml"]
  pull_request:
    paths: ["op0/**", "tools/start_op0.ps1", ".github/workflows/op0.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: |
            op0
            tools/start_op0.ps1
            experiments/s6_4_founding_cohort_release/correction
            experiments/s6_4_founding_cohort_release/hatch
            experiments/s6_4_ecological_mechanism_closure/portable-physics/joint
            experiments/s6_4_ecological_mechanism_closure/joint-repaired
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify archives, API, terminal and SQLite publication
        run: python -m unittest discover -s op0/tests -v
      - name: Syntax-check the offline browser client
        run: node --check op0/web/viewer.js
      - name: Replay real worlds in Chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m op0 --cache "$RUNNER_TEMP/op0-archive-cache" serve --no-browser > "$RUNNER_TEMP/op0-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ > /dev/null
          node op0/tests/browser_smoke.mjs "$(command -v google-chrome)" http://127.0.0.1:8765 "$RUNNER_TEMP/op0-browser"
      - name: Verify launch script in Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @("1", "d 150", "q") | Set-Content -Encoding ascii "$env:RUNNER_TEMP\op0-commands.txt"
          cmd.exe /d /c "pwsh -NoProfile -File .\tools\start_op0.ps1 -Terminal -Python python < ""$env:RUNNER_TEMP\op0-commands.txt"" > ""$env:RUNNER_TEMP\op0-terminal.txt"""
          $status = $LASTEXITCODE
          Get-Content -Encoding utf8 "$env:RUNNER_TEMP\op0-terminal.txt"
          if ($status -ne 0 -or -not (Select-String -SimpleMatch "45 workers" "$env:RUNNER_TEMP\op0-terminal.txt")) { exit 1 }
