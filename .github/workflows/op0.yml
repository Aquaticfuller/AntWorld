name: OP0 Observation Preview
on:
  push:
    paths: ["op0/**", "experiments/m0/portable-demo/**", "experiments/m1/witnesses/**", "experiments/r0/witnesses/**", "experiments/r0_r1/witnesses/**", "tools/start_op0.ps1", "tools/start_m0.cmd", "tools/check_repository.py", ".github/workflows/op0.yml"]
  pull_request:
    paths: ["op0/**", "experiments/m0/portable-demo/**", "experiments/m1/witnesses/**", "experiments/r0/witnesses/**", "experiments/r0_r1/witnesses/**", "tools/start_op0.ps1", "tools/start_m0.cmd", "tools/check_repository.py", ".github/workflows/op0.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          sparse-checkout: |
            op0
            tools/start_op0.ps1
            tools/start_m0.cmd
            experiments/m0/portable-demo
            experiments/m1/witnesses
            experiments/r0/witnesses
            experiments/r0_r1/witnesses
            experiments/s6_4_founding_cohort_release/correction
            experiments/s6_4_founding_cohort_release/hatch
            experiments/s6_4_ecological_mechanism_closure/portable-physics/joint
            experiments/s6_4_ecological_mechanism_closure/joint-repaired
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify archives, API, terminal and SQLite publication
        run: python -m unittest discover -s op0/tests -v
      - name: Check the offline browser client and live motion projection
        run: |
          node --check op0/web/viewer.js
          node --check op0/web/experience.js
          node --check op0/web/live.js
          node op0/tests/live_motion.mjs
      - name: Replay real worlds in Chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m op0 --cache "$RUNNER_TEMP/op0-archive-cache" serve --no-browser > "$RUNNER_TEMP/op0-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ > /dev/null
          node op0/tests/browser_smoke.mjs "$(command -v google-chrome)" http://127.0.0.1:8765 "$RUNNER_TEMP/op0-browser"
      - name: Follow MicroWorld birth, care, resource delivery and excavation in Chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m op0 --micro --cache "$RUNNER_TEMP/op0-archive-cache" serve --replay --port 8766 --no-browser > "$RUNNER_TEMP/m0-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8766/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8766/ > /dev/null
          node op0/tests/browser_smoke.mjs "$(command -v google-chrome)" http://127.0.0.1:8766 "$RUNNER_TEMP/m0-browser" micro
      - name: Replay a committed R0 movement and compare nest sections in Chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m op0 --micro --cache "$RUNNER_TEMP/op0-archive-cache" serve --r0 --replay --port 8767 --no-browser > "$RUNNER_TEMP/r0-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8767/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8767/ > /dev/null
          node op0/tests/browser_smoke.mjs "$(command -v google-chrome)" http://127.0.0.1:8767 "$RUNNER_TEMP/r0-browser" r0
      - name: Compare real R0-r1 motor segments and seeded nest growth in Chrome
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -m op0 --micro --cache "$RUNNER_TEMP/op0-archive-cache" serve --r0-r1 --replay --port 8768 --no-browser > "$RUNNER_TEMP/r0-r1-service.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for i in {1..25}; do
            if curl -fsS http://127.0.0.1:8768/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8768/ > /dev/null
          node op0/tests/browser_smoke.mjs "$(command -v google-chrome)" http://127.0.0.1:8768 "$RUNNER_TEMP/r0-r1-browser" r0r1
      - name: Verify launch script in Windows PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\tools\start_m0.cmd --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @("1", "d 150", "q") | Set-Content -Encoding ascii "$env:RUNNER_TEMP\op0-commands.txt"
          cmd.exe /d /c "pwsh -NoProfile -File .\tools\start_op0.ps1 -Terminal -Language en -Python python < ""$env:RUNNER_TEMP\op0-commands.txt"" > ""$env:RUNNER_TEMP\op0-terminal.txt"""
          $status = $LASTEXITCODE
          Get-Content -Encoding utf8 "$env:RUNNER_TEMP\op0-terminal.txt"
          if ($status -ne 0 -or -not (Select-String -SimpleMatch "45 workers" "$env:RUNNER_TEMP\op0-terminal.txt")) { exit 1 }
      - name: Open MicroWorld from the Windows launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $inputPath = Join-Path $env:RUNNER_TEMP 'm0-input.txt'
          $outputPath = Join-Path $env:RUNNER_TEMP 'm0-terminal.txt'
          @('1', 'd 90', 'a 4', 'q') | Set-Content -Encoding ascii $inputPath
          $process = Start-Process (Get-Command pwsh).Source `
            -ArgumentList '-NoProfile -File tools/start_op0.ps1 -MicroWorld -Terminal -Language en' `
            -RedirectStandardInput $inputPath -RedirectStandardOutput $outputPath `
            -WindowStyle Hidden -PassThru -Wait
          Get-Content -Encoding utf8 $outputPath
          if ($process.ExitCode -ne 0 -or -not (Select-String -SimpleMatch '15 workers' $outputPath) `
            -or -not (Select-String -SimpleMatch 'Tracking #4' $outputPath)) { exit 1 }
